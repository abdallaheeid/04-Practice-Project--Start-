name: Lint, Test and Deploy the Project
on:
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Project Code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Linting the Project
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Project Code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Test Project
        run: |
          echo 'Testing the Project'
          npm run test

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo 'Deploy Project'
